name: integrate
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  matrix:
    name: "Linux PHP ${{ matrix.php }} (${{ matrix.ts }})"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        php: ["7.0", "7.3", "7.4", "8.0", "8.3", "8.4", "8.5"]
        ts: ["nts"]
        include:
          - php: "8.5"
            ts: "ts"
    env:
      PHP: ${{ matrix.php }}
      GITHUB: "yes"
      enable_debug: "yes"
      enable_session: "yes"
      enable_maintainer_zts: ${{ matrix.ts == 'ts' && 'yes' || 'no' }}
      TEST_PHP_ARGS : "--show-diff"
      REPORT_EXIT_STATUS: "yes"
      NO_INTERACTION: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
      - name: Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install
        run: |
          sudo apt-get update && \
          sudo apt --fix-broken install && \
          sudo apt-get install -y \
          libcurl-ocaml-dev \
          re2c
      - name: Prepare
        run: |
            phpize
      - name: Build
        run: |
            ./configure
      - name: Make
        run: |
            make
      - name: Test
        run: |
            EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
            if [ -n "$EXT_DIR" ] && [ -f "$EXT_DIR/json.so" ]; then
              # PHP 7.x ships json as a shared extension; the phpize test
              # harness strips all system extension= lines, so preload json
              # before yar (yar declares a module dependency on json)
              make test PHP_TEST_SHARED_EXTENSIONS="-d extension=$EXT_DIR/json.so -d extension=yar.so"
            else
              make test
            fi

  windows:
    name: "Windows PHP ${{ matrix.php }} (${{ matrix.ts }})"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.5"]
        ts: ["nts"]
        include:
          - php: "8.5"
            ts: "ts"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and test extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php }}
          arch: x64
          ts: ${{ matrix.ts }}
          libs: libcurl,openssl,libssh2,nghttp2,brotli,libzstd
          # yar's tests bind fixed ports (8888, 9999, ...), so parallel
          # workers collide; tests must run serially
          test-workers: 1
